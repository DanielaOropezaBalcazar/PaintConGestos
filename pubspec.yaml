name: face_paint_gestures
description: "Aplicación de pintura con gestos faciales usando ML Kit y BLoC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 🎯 BLoC - Gestión de estado
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Google ML Kit para detección facial
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0
  
  # Cámara - soporte multiplataforma
  camera: ^0.10.6
  camera_web: ^0.3.0+2
  
  # Utilidades
  path_provider: ^2.1.3
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Para testing de BLoCs
  bloc_test: ^9.1.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/background.jpg