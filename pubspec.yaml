name: face_paint_gestures
description: "Aplicación de pintura con gestos faciales usando ML Kit"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Google ML Kit para detección facial (Android/iOS)
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0
  
  # Cámara - soporte multiplataforma
  camera: ^0.10.6
  
  # Soporte web para cámara
  camera_web: ^0.3.0+2
  
  # Utilidades y gestión de estado
  provider: ^6.1.1
  path_provider: ^2.1.3
  
  # Para mejor manejo de assets si es necesario
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # Generación de código para iOS si usas ML Kit
  generate: true
  assets:
    - assets/background.jpg
  
  